name: Android build

# Pas de build sur chaque branche de travail : seulement main, staging et les PR
# (un push de branche + PR ou plusieurs branches lançait des builds en double).
on:
  push:
    branches: [main, staging]
    paths-ignore: ["**.md", "LICENSE", "docs/**"]
  pull_request:
    branches: [main, staging]
    paths-ignore: ["**.md", "LICENSE", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

# Un seul build à la fois par branche. Sur main on n'annule jamais : chaque push
# garde sa release versionnée, ils passent l'un après l'autre.
concurrency:
  group: android-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (version de .flutter-version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .flutter-version
          channel: stable
          cache: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Écrire android/local.properties
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          FLUTTER_SDK="${FLUTTER_HOME:-$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")}"
          {
            echo "sdk.dir=${SDK_DIR}"
            echo "flutter.sdk=${FLUTTER_SDK}"
          } > android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Tests
        run: flutter test

      # Clé de publication fournie par les secrets du dépôt (KEYSTORE_BASE64, KEYSTORE_PASSWORD,
      # KEY_ALIAS, KEY_PASSWORD). Sans eux : main échoue (aucune release mal signée), les
      # autres builds sont signés par une clé de debug jetable propre au runner.
      - name: Configurer la signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          IS_MAIN: ${{ github.event_name != 'pull_request' && github.ref_name == 'main' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            if [ "$IS_MAIN" = "true" ]; then
              echo "::error::Secrets de signature absents : aucune release publiée sur main."
              exit 1
            fi
            echo "::warning::Secrets de signature absents : APK signé par une clé de debug jetable."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/release.p12"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/keystore.properties

      # versionCode = run_number (strictement croissant), versionName = version du pubspec,
      # tag de release v<version>.<run_number>. La version est validée : elle finit dans
      # des noms de fichier et de tag.
      - name: Déterminer la version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d+ -f1)
          if ! printf '%s' "$BASE" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::Version du pubspec invalide."
            exit 1
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "name=$BASE.$RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Compiler l'APK (release)
        env:
          BASE: ${{ steps.version.outputs.base }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name="$BASE" \
            --build-number="$RUN_NUMBER"

      # Garde-fou : sur main, l'APK doit être signé par la clé de publication du store
      # (même empreinte que storeSigningCertSha256 dans lib/features/app_update/app_update.dart).
      - name: Vérifier la signature (main)
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        env:
          EXPECTED: 7d85d066c9575d76afe3b7a2b3fe8417a6f9059a76e5034d13aba586fed09e4f
        run: |
          APKSIGNER=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$CERTS" | grep -E "certificate DN|SHA-256 digest"
          SIGNERS=$(echo "$CERTS" | grep -c "certificate SHA-256 digest")
          if [ "$SIGNERS" != "1" ] || ! echo "$CERTS" | grep -q "certificate SHA-256 digest: $EXPECTED"; then
            echo "::error::APK non signé par la clé de publication du store : release refusée."
            exit 1
          fi

      - name: Renommer l'APK avec sa version
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          NAME="LieluApp-$VERSION_NAME.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$NAME"
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lieluapp-apk-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Vraie release permanente pour chaque push sur main (ou lancement manuel sur main).
      - name: Publier la release GitHub (main)
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          TAG="v$VERSION_NAME"
          cat > release-notes.md <<NOTES
          ## Installer LieluApp

          1. Télécharge l'APK \`$APK_NAME\` ci-dessous (section « Assets »).
          2. Ouvre-le. Si Android bloque l'installation, autorise la source (navigateur ou gestionnaire de fichiers) à installer des applications inconnues.
          3. Touche « Installer ».

          Tous les APK sont signés par la clé de publication du store (CN=Lielu Store, SHA-256 \`7D:85:D0:66:C9:57:5D:76:AF:E3:B7:A2:B3:FE:84:17:A6:F9:05:9A:76:E5:03:4D:13:AB:A5:86:FE:D0:9E:4F\`) : une nouvelle version s'installe par-dessus l'ancienne. Si Android refuse (« app non installée »), c'est que l'app installée vient d'une ancienne version signée par la clé de debug : désinstalle-la une fois, puis réinstalle.

          ---
          Run #$RUN_NUMBER ($SHA).
          NOTES
          gh release create "$TAG" \
            "$APK_PATH" \
            --title "LieluApp $TAG" \
            --notes-file release-notes.md \
            --target "$SHA"

      # Autres branches / PR : un tag de pré-release par branche, remplacé à chaque build.
      - name: Déterminer le tag de release debug
        id: reltag
        if: "!(github.event_name != 'pull_request' && github.ref_name == 'main')"
        env:
          # Jamais interpolé dans le script : un nom de branche peut contenir \`$(...)\`.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          SAFE_BRANCH=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')
          echo "tag=debug-$SAFE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "branch=$SAFE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Publier l'APK de test en pré-release
        if: "!(github.event_name != 'pull_request' && github.ref_name == 'main')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.reltag.outputs.tag }}
          BRANCH: ${{ steps.reltag.outputs.branch }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            "$APK_PATH" \
            --title "LieluApp — APK de test ($BRANCH)" \
            --notes "Build de test de la branche. Run #$RUN_NUMBER ($SHA)." \
            --prerelease \
            --target "$SHA"
