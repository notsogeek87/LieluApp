name: lieluapp
description: Lielu Store - le store des applications Lielu
publish_to: none
# versionName = partie avant le +. versionCode et tag de release = run_number du CI.
version: 0.2.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.1
  flutter_riverpod: ^3.2.1
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  crypto: ^3.0.7
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - catalog/apps.json
